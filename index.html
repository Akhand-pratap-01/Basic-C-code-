
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">
        <h1>Calculator</h1>

        <section class="display">
            <div id="history"></div>
            <div id="result">0</div>
        </section>

        <section class="buttons">
            <button data-action="clear" class="function">C</button>
            <button data-action="delete" class="function">⌫</button>
            <button data-action="percent" class="function">%</button>
            <button data-value="/" class="operator">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button data-value="*" class="operator">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button data-value="-" class="operator">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button data-value="+" class="operator">+</button>

            <button data-value="0" class="zero">0</button>
            <button data-value=".">.</button>
            <button data-action="calculate" class="operator">=</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
